# Agent skills target directories.
#
# Copy this file to config/agents.conf and edit it for the local machine.
#
# Format:
#   agent_name|skills_directory
#
# The directory field may use $HOME or ~. Lines beginning with # are ignored.
# Keep agent_name simple: letters, numbers, underscore, or hyphen.

qoder|$HOME/.qoder/skills
qoderwork|$HOME/.qoderwork/skills
codex|$HOME/.codex/skills

# Optional:
claude|$HOME/.claude/skills
